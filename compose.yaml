services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: alfa
      POSTGRES_DB: alfa_course
    # Drop the provided Альфа-Курс dump as ./data/<name>.sql to auto-restore it
    # on the first start. Without a dump the DB stays empty and the backend
    # transparently serves its demo catalog. See ./data/README.md.
    volumes:
      - ./data:/docker-entrypoint-initdb.d:ro
      - alfa_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa_course"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      # The backend owns the DB connection and calls the ML catalog loader.
      DATABASE_URL: postgresql://alfa:alfa@db:5432/alfa_course
      RECO_STRATEGY: ${RECO_STRATEGY:-baseline}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./recommender:/recommender
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  alfa_pgdata:
